# @package _global_
hydra/job_logging: colorlog
hydra/hydra_logging: colorlog

# self is first so logs_dir can be overwritten based on mode
defaults:
  - _self_
  - optim: optim
  - mode: local
  - dataset: maze
  - model: past
  - exp: null

# Assortment of default settings
project: mlmu
note: ""
name: ${note}${model_name}-${dataset_name}-lr${optim.learning_rate}
# TODO change logs_dir this to where you want your logs stored (includes checkpoints)
# logs_dir: /checkpoint/${oc.env:USER}/logs/${project}/${name}/${now:%Y-%m-%d_%H-%M-%S}
logs_dir: /checkpoint/sayan/logs/${project}/${name}/${now:%Y-%m-%d_%H-%M-%S}
resume: True
seed: 42
debug: False

# tells hydra to store logs for sweeps or runs in logs_dir
hydra:
  job:
    name: ${name}
    # when exceuting a job change to the logs_dir
    chdir: True
    env_set:
      NCCL_P2P_DISABLE: 1
      # TODO change this to the place you would like your data saved
      DATA_ROOT: /checkpoint/sayan/knowledge
  run:
    dir: ${logs_dir}
  sweep:
    dir: ${logs_dir}

trainer:
  precision: 16-mixed
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  accumulate_grad_batches: 4  # Increase batch stability

wandb:
  project: ${project}
  entity: planning-llms
  notes: null
  tags: null
  log_model: False
  save_code: True
  reinit: True
  offline: False


# Whether to train the base autoregressive (AR) model
train_base: true  #  We set this to true to train the AR baseline model from scratch or continue training.

# Whether to train the planning adapter (the planner)
train_planner: False  #  We set this to false because we don't want to train the planner adapter right now.

planning:
  # Number of candidate plans to sample per input
  num_samples: 5  # Try 5 different continuation paths for each prompt to help the planner choose the best one.

  # How many steps/tokens each plan should continue for
  continuation_length: 10  # Limit the length of each generated plan to 10 tokens for efficiency and control.

  # How to pick where to split the input and continuation
  split_idx_mode: random  # Use a random index in the input sequence as the split point to encourage generalization.

  # Whether to exclude the prompt from planner input
  cut_outputs: true  # Only pass the continuation (not the full prompt) to the planner to force learning from completions alone.
